<table mat-table [dataSource]="purchaseOrders" class="mat-elevation-z4 w-100 bg-white rounded-3 shadow-sm">

    
    <ng-container matColumnDef="poNumber">
      <th mat-header-cell *matHeaderCellDef class="text-uppercase fw-bold">PO Number</th>
      <td mat-cell *matCellDef="let order" class="text-nowrap">{{ order.poNumber }}</td>
    </ng-container>
  
  
    <ng-container matColumnDef="vendor">
      <th mat-header-cell *matHeaderCellDef class="text-uppercase fw-bold">Vendor</th>
      <td mat-cell *matCellDef="let order">{{ order.vendor }}</td>
    </ng-container>
  
    
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef class="text-uppercase fw-bold">Date</th>
      <td mat-cell *matCellDef="let order">{{ order.date }}</td>
    </ng-container>
  
   
    <ng-container matColumnDef="totalValue">
      <th mat-header-cell *matHeaderCellDef class="text-uppercase fw-bold">Total</th>
      <td mat-cell *matCellDef="let order">{{ order.totalValue | currency }}</td>
    </ng-container>
  
   
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="text-uppercase fw-bold">Status</th>
      <td mat-cell *matCellDef="let order">
        <span [ngClass]="{
          'badge bg-success': order.status === 'Approved',
          'badge bg-danger': order.status === 'Rejected',
          'badge bg-secondary': order.status !== 'Approved' && order.status !== 'Rejected'
        }">{{ order.status }}</span>
      </td>
    </ng-container>
  
  
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-uppercase fw-bold">Actions</th>
      <td mat-cell *matCellDef="let order">
        <button mat-raised-button color="primary" (click)="exportSingleOrderToPDF(order)" class="fw-semibold">
          <mat-icon class="me-1">picture_as_pdf</mat-icon> Export PDF
        </button>
      </td>
    </ng-container>
  

    <tr mat-header-row *matHeaderRowDef="['poNumber', 'vendor', 'date', 'totalValue', 'status', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['poNumber', 'vendor', 'date', 'totalValue', 'status', 'actions']"></tr>
  </table>
